  title: "Mealworms"
  image:
    url: "assets/images/mealworms.jpg"
    alt: "My mealworms"
  description: "Designed controlled breeding experiments to evaluate the feasibility of mealworm cultivation as a sustainable food source, following European regulatory approval for insect consumption. Performed an empirical study to compare setups and assess yield and labor costs."
