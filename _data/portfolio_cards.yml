  image:
    url: ""
    alt: ""
  description: "Developed perception and navigation algorithms for autonomous barges in urban waterways, in collaboration with imec and industrial partners, contributing to a broader initiative to shift last-mile logistics from road to water."
  button:
    href: "https://www.imec-int.com/en/research-portfolio/smartwaterway"
    label: "Project Information"

