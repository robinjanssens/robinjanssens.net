-
  title: "Crowd Counting"
  image:
    url: ""
    alt: ""
  description: "Conducted a methodical comparative study of manual and technological crowd counting methods across multiple large-scale events, in collaboration with the University of Antwerp and KDG University College. Results informed Telwijzer, a decision-support tool recommending counting strategies to event organizers based on accuracy, cost, and event parameters."
  button:
    href: "https://www.kdg.be/onderzoek/projecten/crowd-counting"
    label: "Project Information"
-
